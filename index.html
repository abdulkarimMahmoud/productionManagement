            function renderPasswordActions() {
                const container = document.getElementById('passwordActions'); if(!container) return;
                container.innerHTML = '';
                if(state.password) {
                    const changeBtn = document.createElement('button'); changeBtn.className='btn-secondary'; changeBtn.textContent='تغيير كلمة المرور'; changeBtn.onclick=()=>{ lockMode='change'; updateLockScreen(); }; container.appendChild(changeBtn);
                    const removeBtn = document.createElement('button'); removeBtn.className='btn-danger'; removeBtn.textContent='إزالة كلمة المرور'; removeBtn.onclick=()=>{ showModal('تأكيد الإزالة','هل أنت متأكد من إزالة كلمة المرور؟',[{ key:'cancel',label:'إلغاء',close:true},{ key:'remove',label:'إزالة',danger:true,callback:()=>{ state.password=''; saveState(); showToast('🔓 تمت إزالة كلمة المرور'); renderSettings(document.getElementById('appMain')); }}])}; container.appendChild(removeBtn);
                } else {
                    const setBtn = document.createElement('button'); setBtn.className='btn-primary'; setBtn.textContent='تعيين كلمة مرور (اختياري)'; setBtn.onclick=()=>{ lockMode='set'; updateLockScreen(); }; container.appendChild(setBtn);
                }
            }

            // ========== PRODUCTION ==========
            function renderProduction(main) {
                const today = getToday();
                const todayRecords = state.records.filter(r => r.date === today);
                const totalToday = todayRecords.reduce((s,r) => s + r.totalAmount, 0);
                main.innerHTML = `
                    <div class="app-card">
                        <div class="section-header"><span class="section-icon-box">${icons.factory}</span><span>تسجيل الإنتاج</span></div>
                        <p class="text-secondary mb-2">📅 ${formatDateArabic(today)}</p>
                        <div class="field-group"><label class="field-label">اختيار البضاعة</label><select class="field-input" id="prodGoodSelect"><option value="">-- اختر البضاعة --</option>${state.goods.map(g=>`<option value="${g.id}">${escHtml(g.name)} (${g.type})</option>`).join('')}</select></div>
                        <div id="prodCalcPreview" style="display:none;"></div>
                        <div class="field-group mt-2"><label class="field-label">الكمية (عدد القطع)</label><input type="number" class="field-input" id="prodQuantity" placeholder="أدخل الكمية" min="1" step="1"></div>
                        <div id="prodTotalDisplay" style="display:none;"></div>
                        <button class="btn-primary btn-primary-muted mt-2" id="recordProductionBtn">${icons.plus} تسجيل العملية</button>
                        <div id="prodSuccessBanner" style="display:none;"></div>
                    </div>
                    <div class="app-card" id="todayProductionCard" style="display:${todayRecords.length>0?'block':'none'};">
                        <div class="section-header"><span class="section-icon-box">${icons.document}</span><span>إنتاج اليوم</span></div>
                        <p class="text-secondary">إجمالي العمليات: <strong>${todayRecords.length}</strong> | المجموع: <strong>${formatPrice(totalToday)} $</strong></p>
                        <div id="todayRecordsList"></div>
                    </div>
                    <div class="app-card" id="endOfDayCard" style="display:${todayRecords.length>0?'block':'none'};">
                        <div class="section-header"><span class="section-icon-box">${icons.users}</span><span>نهاية الدوام - توزيع الأجور</span></div>
                        <div class="field-group"><label class="field-label">الساعات الافتراضية</label><div style="display:flex;gap:6px;align-items:center;"><input type="number" class="field-input worker-hours-input" id="eodDefaultHours" placeholder="${state.defaultHours}" min="0.5" max="24" step="0.5"><button class="btn-secondary" id="eodApplyAllBtn" style="font-size:11px;padding:7px 10px;">تطبيق على الكل</button></div></div>
                        <div style="display:flex;gap:6px;margin-bottom:8px;"><button class="btn-secondary" id="eodSelectAllBtn" style="font-size:11px;">${icons.selectAll} تحديد الكل</button><button class="btn-secondary" id="eodDeselectAllBtn" style="font-size:11px;">إلغاء التحديد</button></div>
                        <div id="eodWorkerChips" class="flex-wrap" style="display:flex;gap:4px;margin-bottom:8px;"></div>
                        <div id="eodWorkerHours" class="hours-section" style="display:none;"></div>
                        <div class="text-secondary mt-2">إجمالي الساعات: <strong id="eodTotalHours">0</strong></div>
                        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;"><button class="btn-primary" id="eodDistributeBtn">💰 توزيع الأجور</button><button class="btn-secondary" id="eodResetBtn">${icons.reset} تصفير</button></div>
                    </div>
                `;

                const prodGoodSelect = document.getElementById('prodGoodSelect');
                const prodQuantity = document.getElementById('prodQuantity');
                const prodCalcPreview = document.getElementById('prodCalcPreview');
                const prodTotalDisplay = document.getElementById('prodTotalDisplay');
                const recordProductionBtn = document.getElementById('recordProductionBtn');

                function updateProdPreview() {
                    const gid = prodGoodSelect.value;
                    const qty = parseInt(prodQuantity.value) || 0;
                    if (!gid || qty < 1) { prodCalcPreview.style.display='none'; prodTotalDisplay.style.display='none'; recordProductionBtn.classList.add('btn-primary-muted'); return; }
                    const good = state.goods.find(g => g.id === gid);
                    const total = calculateTotal(good, qty);
                    prodCalcPreview.style.display='block';
                    prodCalcPreview.innerHTML = `<div class="calc-preview">${good.type!=='قطعة'?`<span class="calc-label">الأبعاد:</span> ${good.length}×${good.width}${good.type==='حجم'?'×'+good.height:''} سم → <span class="calc-value">${(good.length/100).toFixed(2)}م × ${(good.width/100).toFixed(2)}م${good.type==='حجم'?' × '+(good.height/100).toFixed(2)+'م':''}</span><br>`:''}<span class="calc-label">المعادلة:</span> ${getCalcDescription(good, qty)}</div>`;
                    prodTotalDisplay.style.display='block';
                    prodTotalDisplay.innerHTML = `<div class="total-display"><div class="total-label">الإجمالي</div><div class="total-amount">${formatPrice(total)} $</div></div>`;
                    recordProductionBtn.classList.remove('btn-primary-muted');
                }
                prodGoodSelect.addEventListener('change', updateProdPreview);
                prodQuantity.addEventListener('input', updateProdPreview);

                recordProductionBtn.addEventListener('click', () => {
                    if(recordProductionBtn.classList.contains('btn-primary-muted')) return;
                    const gid = prodGoodSelect.value; const qty = parseInt(prodQuantity.value)||0;
                    const good = state.goods.find(g=>g.id===gid);
                    const record = { id: generateId(), date: today, goodId: good.id, goodName: good.name, goodType: good.type, quantity: qty, totalAmount: calculateTotal(good, qty), workerIds:[], workerNames:[], workerHours:[], workerWages:[], workerShare:[] };
                    state.records.push(record); saveState();
                    document.getElementById('prodSuccessBanner').style.display='block';
                    document.getElementById('prodSuccessBanner').innerHTML = `<div class="success-banner">${icons.checkCircle} تم تسجيل العملية بنجاح! ${formatUnitQuantity(good.type,good.length,good.width,good.height,qty)} - ${formatPrice(record.totalAmount)} $</div>`;
                    setTimeout(()=>{ document.getElementById('prodSuccessBanner').style.display='none'; }, 4000);
                    prodQuantity.value = ''; updateProdPreview(); renderProduction(main);
                });

                renderTodayRecords(todayRecords, main);
                renderEndOfDay(todayRecords, main);
            }

            function renderTodayRecords(todayRecords, main) {
                const container = document.getElementById('todayRecordsList'); if(!container) return;
                if(todayRecords.length===0){ container.innerHTML='<p class="text-secondary text-center">لا توجد سجلات لليوم</p>'; return; }
                container.innerHTML = todayRecords.map(r => {
                    const good = state.goods.find(g=>g.id===r.goodId) || { type: r.goodType, length:0, width:0, height:0 };
                    return `<div class="record-item"><div style="flex:1;min-width:0;"><strong>${escHtml(r.goodName)}</strong><span class="text-secondary"> | ${formatUnitQuantity(r.goodType,good.length,good.width,good.height,r.quantity)}</span><span style="color:var(--gold-dark);font-weight:600;"> | ${formatPrice(r.totalAmount)} $</span></div><button class="btn-icon-danger" data-delete-record="${r.id}">${icons.trash}</button></div>`;
                }).join('');
                container.querySelectorAll('[data-delete-record]').forEach(btn => btn.addEventListener('click', function() {
                    const rid = this.dataset.deleteRecord;
                    const record = state.records.find(r=>r.id===rid);
                    showModal('تأكيد حذف العملية', `هل أنت متأكد من حذف العملية "<strong>${escHtml(record.goodName)}</strong>" بقيمة ${formatPrice(record.totalAmount)} $ ؟`, [
                        { key:'cancel', label:'إلغاء', close:true },
                        { key:'delete', label:'حذف', danger:true, callback:()=>{ state.records=state.records.filter(r=>r.id!==rid); saveState(); showToast('🗑️ تم حذف السجل'); renderProduction(main); }}
                    ]);
                }));
            }

            function renderEndOfDay(todayRecords, main) {
                const chipsContainer = document.getElementById('eodWorkerChips');
                const hoursContainer = document.getElementById('eodWorkerHours');
                const totalHoursEl = document.getElementById('eodTotalHours');
                const defaultHoursInput = document.getElementById('eodDefaultHours');
                if(!chipsContainer||!hoursContainer) return;

                if(!main._eodSelectedWorkers) main._eodSelectedWorkers = {};
                if(!main._eodWorkerHours) main._eodWorkerHours = {};
                const selWorkers = main._eodSelectedWorkers;
                const workerHours = main._eodWorkerHours;

                if(Object.keys(selWorkers).length===0 && state.workers.length>0) {
                    state.workers.forEach(w => { selWorkers[w.id]=true; workerHours[w.id]=''; });
                }

                function updateEODUI() {
                    chipsContainer.innerHTML = state.workers.map(w => `<span class="worker-chip ${selWorkers[w.id]?'worker-chip-active':''}" data-wid="${w.id}"><span class="chip-check">${selWorkers[w.id]?'✓':''}</span>${escHtml(w.name)}</span>`).join('');
                    const selectedIds = state.workers.filter(w=>selWorkers[w.id]).map(w=>w.id);
                    if(selectedIds.length>0) {
                        hoursContainer.style.display='block';
                        hoursContainer.innerHTML = state.workers.filter(w=>selWorkers[w.id]).map(w => {
                            const hrs = workerHours[w.id]||'';
                            const wagePreview = hrs ? calculateWorkerWagePreview(w.id, parseFloat(hrs), todayRecords) : 0;
                            return `<div class="list-item"><span style="font-weight:600;">${escHtml(w.name)}</span><input type="number" class="worker-hours-input" data-wid="${w.id}" value="${hrs}" placeholder="${state.defaultHours}" min="0.1" max="24" step="0.1"><span class="text-secondary" style="font-size:11px;">الأجر المتوقع: <strong>${formatPrice(wagePreview)} $</strong></span></div>`;
                        }).join('');
                    } else { hoursContainer.style.display='none'; }
                    totalHoursEl.textContent = selectedIds.reduce((sum,wid)=>sum+(parseFloat(workerHours[wid])||0),0).toFixed(1)||'0.0';
                }

                function calculateWorkerWagePreview(wid, hrs, records) {
                    const allIds = state.workers.filter(w=>selWorkers[w.id]).map(w=>w.id);
                    const totalHrs = allIds.reduce((sum,id)=>sum+(parseFloat(workerHours[id])||0),0);
                    if(totalHrs<=0||!allIds.includes(wid)||!hrs) return 0;
                    return (hrs/totalHrs)*records.reduce((s,r)=>s+r.totalAmount,0);
                }

                updateEODUI();

                chipsContainer.addEventListener('click', e => {
                    const chip = e.target.closest('.worker-chip'); if(!chip) return;
                    const wid = chip.dataset.wid; selWorkers[wid]=!selWorkers[wid];
                    if(!selWorkers[wid]) delete selWorkers[wid];
                    if(!(wid in workerHours)) workerHours[wid]='';
                    updateEODUI();
                });

                hoursContainer.addEventListener('input', e => {
                    if(e.target.classList.contains('worker-hours-input')) {
                        const wid = e.target.dataset.wid; const v = parseFloat(e.target.value)||0;
                        workerHours[wid] = v>0 ? v : ''; updateEODUI();
                    }
                });

                document.getElementById('eodApplyAllBtn').addEventListener('click', ()=>{
                    const dv = parseFloat(defaultHoursInput.value)||state.defaultHours;
                    if(!dv||dv<=0){ showToast('الرجاء إدخال قيمة صحيحة للساعات','warning'); return; }
                    Object.keys(selWorkers).forEach(wid=>{ workerHours[wid]=dv; });
                    state.defaultHours=dv; saveState(); updateEODUI(); showToast('تم تطبيق الساعات على الجميع');
                });

                document.getElementById('eodSelectAllBtn').addEventListener('click', ()=>{
                    state.workers.forEach(w=>{ selWorkers[w.id]=true; if(!(w.id in workerHours)) workerHours[w.id]=''; });
                    updateEODUI();
                });

                document.getElementById('eodDeselectAllBtn').addEventListener('click', ()=>{
                    Object.keys(selWorkers).forEach(k=>delete selWorkers[k]); updateEODUI();
                });

                document.getElementById('eodDistributeBtn').addEventListener('click', ()=>{
                    const selectedIds = state.workers.filter(w=>selWorkers[w.id]).map(w=>w.id);
                    if(selectedIds.length===0){ showToast('الرجاء اختيار عامل واحد على الأقل','warning'); return; }
                    const totalHrs = selectedIds.reduce((sum,wid)=>sum+(parseFloat(workerHours[wid])||0),0);
                    if(totalHrs<=0){ showToast('إجمالي الساعات يجب أن يكون أكبر من صفر','warning'); return; }
                    const today = getToday();
                    const todayRecs = state.records.filter(r=>r.date===today);
                    if(todayRecs.length===0){ showToast('لا توجد سجلات لليوم','warning'); return; }
                    const dayTotal = todayRecs.reduce((sum,r)=>sum+r.totalAmount,0);
                    todayRecs.forEach(r => {
                        r.workerIds = [...selectedIds];
                        r.workerNames = selectedIds.map(wid => { const w=state.workers.find(wk=>wk.id===wid); return w?w.name:''; });
                        // Allocate hours proportionally to record value
                        r.workerHours = selectedIds.map(wid => {
                            const hrs = parseFloat(workerHours[wid])||0;
                            return (hrs * (r.totalAmount / dayTotal));
                        });
                        r.workerWages = selectedIds.map(wid => {
                            const hrs = parseFloat(workerHours[wid])||0;
                            return (hrs/totalHrs)*r.totalAmount;
                        });
                        r.workerShare = selectedIds.map(wid => {
                            const hrs = parseFloat(workerHours[wid])||0;
                            return hrs/totalHrs;
                        });
                    });
                    saveState(); showToast('✅ تم توزيع الأجور بنجاح'); renderProduction(main);
                });

                document.getElementById('eodResetBtn').addEventListener('click', ()=>{
                    main._eodSelectedWorkers = {}; main._eodWorkerHours = {};
                    state.workers.forEach(w=>{ main._eodSelectedWorkers[w.id]=true; main._eodWorkerHours[w.id]=''; });
                    updateEODUI(); showToast('تمت إعادة التعيين');
                });
            }

            // ========== REPORTS ==========
            function renderReports(main) {
                main.innerHTML = `
                    <div class="report-tabs"><button class="report-tab ${reportSubTab==='invoices'?'active':''}" id="reportTabInvoices">📋 الفواتير</button><button class="report-tab ${reportSubTab==='archive'?'active':''}" id="reportTabArchive">📦 الأرشيف</button></div>
                    <div id="reportContent"></div>
                `;
                document.getElementById('reportTabInvoices').addEventListener('click', ()=>{ reportSubTab='invoices'; renderReports(main); });
                document.getElementById('reportTabArchive').addEventListener('click', ()=>{ reportSubTab='archive'; renderReports(main); });
                if(reportSubTab==='invoices') renderInvoices(main); else renderArchive(main);
            }

            function renderInvoices(main) {
                const content = document.getElementById('reportContent');
                const allDates = state.records.map(r=>r.date).sort();
                const defaultStart = allDates.length ? allDates[0] : getToday();
                const defaultEnd = getToday();
                content.innerHTML = `
                    <div class="app-card">
                        <div class="section-header"><span class="section-icon-box">${icons.book}</span><span>تحديد نطاق التاريخ للفاتورة</span></div>
                        <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;">
                            <div class="field-group" style="flex:1;min-width:120px;"><label class="field-label">من تاريخ</label><input type="date" class="field-input" id="customStartDate" value="${defaultStart}"></div>
                            <div class="field-group" style="flex:1;min-width:120px;"><label class="field-label">إلى تاريخ</label><input type="date" class="field-input" id="customEndDate" value="${defaultEnd}"></div>
                            <button class="btn-primary" id="applyCustomRangeBtn" style="width:auto;padding:10px 20px;">📅 عرض الفاتورة</button>
                            <button class="btn-secondary" id="showAllBtn" style="width:auto;padding:10px 16px;">عرض الكل</button>
                        </div>
                    </div>
                    <div id="customInvoiceContainer"></div>
                `;

                function buildInvoiceHTML(records, start, end) {
                    if(records.length===0) return '<div class="app-card"><p class="text-secondary text-center">لا توجد سجلات في هذا النطاق</p></div>';
                    const totalAmount = records.reduce((s,r)=>s+r.totalAmount,0);
                    const workerMap = {};
                    const dailyGoodsMap = {};
                    records.forEach(r => {
                        if(!dailyGoodsMap[r.date]) dailyGoodsMap[r.date] = { goods:[], dayTotal:0 };
                        const good = state.goods.find(g=>g.id===r.goodId) || { type: r.goodType, length:0, width:0, height:0 };
                        dailyGoodsMap[r.date].goods.push({ goodName: r.goodName, goodType: r.goodType, quantity: r.quantity, totalAmount: r.totalAmount, length: good.length, width: good.width, height: good.height });
                        dailyGoodsMap[r.date].dayTotal += r.totalAmount;
                        if(r.workerIds && r.workerIds.length>0) {
                            r.workerIds.forEach((wid,i) => {
                                if(!workerMap[wid]) workerMap[wid] = { workerName: r.workerNames[i]||'', workDays: new Set(), totalHours:0, totalWage:0 };
                                workerMap[wid].workDays.add(r.date);
                                workerMap[wid].totalHours += r.workerHours[i] || 0;
                                workerMap[wid].totalWage += r.workerWages[i] || 0;
                            });
                        }
                    });
                    const workerRows = Object.values(workerMap).map(w => ({
                        workerName: w.workerName, workDays: w.workDays.size, totalHours: w.totalHours, totalWage: w.totalWage
                    }));
                    const sortedDates = Object.keys(dailyGoodsMap).sort();
                    const wk = start+'|'+end;
                    return `
                        <div class="app-card">
                            <div class="section-header"><span class="section-icon-box">${icons.book}</span><span>فاتورة: ${formatDateArabic(start)} - ${formatDateArabic(end)}</span></div>
                            <p class="text-secondary">عدد العمليات: <strong>${records.length}</strong> | الإجمالي: <strong>${formatPrice(totalAmount)} $</strong></p>
                            <table class="invoice-table">
                                <thead><tr><th>العامل</th><th>أيام العمل</th><th>الساعات</th><th>الأجر</th></tr></thead>
                                <tbody>
                                    ${workerRows.map(w=>`<tr><td>${escHtml(w.workerName)}</td><td>${w.workDays}</td><td>${w.totalHours.toFixed(1)}</td><td>${formatPrice(w.totalWage)} $</td></tr>`).join('')}
                                    ${workerRows.length===0?'<tr><td colspan="4" class="text-secondary">لم يتم توزيع الأجور بعد</td></tr>':''}
                                </tbody>
                            </table>
                            <details class="mt-2" style="font-size:12px;"><summary style="cursor:pointer;font-weight:600;color:var(--gold-dark);">تفاصيل يومية</summary>
                                <div style="margin-top:8px;">${sortedDates.map(d=>`<div style="margin-bottom:6px;padding:6px;background:#fafaf7;border-radius:7px;"><strong>${formatDateArabic(d)}</strong> - ${formatPrice(dailyGoodsMap[d].dayTotal)} $<div style="font-size:11px;color:#666;">${dailyGoodsMap[d].goods.map(g=>`${escHtml(g.goodName)} (${g.goodType}) - ${formatUnitQuantity(g.goodType,g.length,g.width,g.height,g.quantity)} - ${formatPrice(g.totalAmount)} $`).join('<br>')}</div></div>`).join('')}</div>
                            </details>
                            <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;" class="no-print">
                                <button class="btn-primary" data-archive-range="${wk}" style="width:auto;padding:9px 14px;font-size:12px;">${icons.archive} أرشفة</button>
                                <button class="btn-secondary" data-print-range="${wk}" style="width:auto;padding:9px 14px;font-size:12px;">${icons.printer} طباعة</button>
                            </div>
                        </div>`;
                }

                document.getElementById('applyCustomRangeBtn').addEventListener('click', ()=>{
                    const start = document.getElementById('customStartDate').value, end = document.getElementById('customEndDate').value;
                    if(!start||!end||start>end) return showToast('تاريخ غير صحيح','warning');
                    const filtered = state.records.filter(r=>r.date>=start&&r.date<=end);
                    document.getElementById('customInvoiceContainer').innerHTML = buildInvoiceHTML(filtered, start, end);
                });

                document.getElementById('showAllBtn').addEventListener('click', ()=>{
                    if(state.records.length===0) { document.getElementById('customInvoiceContainer').innerHTML='<div class="app-card"><p class="text-secondary text-center">لا توجد سجلات</p></div>'; return; }
                    const start = state.records.reduce((min,r)=>r.date<min?r.date:min, state.records[0].date);
                    const end = state.records.reduce((max,r)=>r.date>max?r.date:max, state.records[0].date);
                    document.getElementById('customInvoiceContainer').innerHTML = buildInvoiceHTML(state.records, start, end);
                });

                if(state.records.length>0) {
                    const start = state.records.reduce((min,r)=>r.date<min?r.date:min, state.records[0].date);
                    const end = state.records.reduce((max,r)=>r.date>max?r.date:max, state.records[0].date);
                    document.getElementById('customInvoiceContainer').innerHTML = buildInvoiceHTML(state.records, start, end);
                } else document.getElementById('customInvoiceContainer').innerHTML='<div class="app-card"><p class="text-secondary text-center">لا توجد سجلات</p></div>';

                document.getElementById('customInvoiceContainer').addEventListener('click', e => {
                    if(e.target.closest('[data-archive-range]')) { const [start,end]=e.target.closest('[data-archive-range]').dataset.archiveRange.split('|'); archiveCustomRange(start,end,main); }
                    if(e.target.closest('[data-print-range]')) window.print();
                });
            }

            function archiveCustomRange(start, end, main) {
                const records = state.records.filter(r=>r.date>=start&&r.date<=end);
                if(records.length===0) return;
                const overlay = document.getElementById('modalOverlay');
                const card = document.getElementById('modalCard');
                card.innerHTML = `<div class="modal-title">أرشفة الفاتورة</div><div class="modal-body"><p>أدخل اسمًا للفاتورة المؤرشفة:</p><input type="text" class="field-input" id="archiveLabelInput" value="فاتورة ${formatDateArabic(start)} - ${formatDateArabic(end)}" style="margin-top:8px;"></div><div class="modal-actions"><button class="modal-btn-primary" id="archiveConfirmBtn">أرشفة</button><button id="archiveCancelBtn">إلغاء</button></div>`;
                overlay.style.display='flex';
                document.getElementById('archiveCancelBtn').addEventListener('click', ()=> overlay.style.display='none');
                document.getElementById('archiveConfirmBtn').addEventListener('click', ()=>{
                    const label = document.getElementById('archiveLabelInput').value.trim() || 'فاتورة '+formatDateArabic(start);
                    const workerMap={}, dailyGoodsMap={};
                    records.forEach(r=>{
                        if(!dailyGoodsMap[r.date]) dailyGoodsMap[r.date]={goods:[],dayTotal:0};
                        const good=state.goods.find(g=>g.id===r.goodId)||{type:r.goodType,length:0,width:0,height:0};
                        dailyGoodsMap[r.date].goods.push({goodName:r.goodName,goodType:r.goodType,quantity:r.quantity,totalAmount:r.totalAmount,length:good.length,width:good.width,height:good.height});
                        dailyGoodsMap[r.date].dayTotal+=r.totalAmount;
                        if(r.workerIds) r.workerIds.forEach((wid,i)=>{ if(!workerMap[wid]) workerMap[wid]={workerName:r.workerNames[i]||'',workDays:new Set(),totalHours:0,totalWage:0}; workerMap[wid].workDays.add(r.date); workerMap[wid].totalHours+=r.workerHours[i]||0; workerMap[wid].totalWage+=r.workerWages[i]||0; });
                    });
                    state.archivedInvoices.push({
                        id: generateId(), createdAt: new Date().toISOString(), label, dateRange:{start,end},
                        items: Object.values(workerMap).map(w=>({workerName:w.workerName,workDays:w.workDays.size,totalHours:w.totalHours,totalWage:w.totalWage})),
                        dailyGoods: Object.keys(dailyGoodsMap).sort().map(d=>({date:d,goods:dailyGoodsMap[d].goods,dayTotal:dailyGoodsMap[d].dayTotal})),
                        totalAmount: records.reduce((s,r)=>s+r.totalAmount,0), recordsCount: records.length
                    });
                    const recordIds = new Set(records.map(r=>r.id));
                    state.records = state.records.filter(r=>!recordIds.has(r.id));
                    saveState(); overlay.style.display='none'; showToast('📦 تمت أرشفة الفاتورة'); renderReports(main);
                });
                overlay.onclick = e => { if(e.target===overlay) overlay.style.display='none'; };
            }

            function renderArchive(main) {
                const content = document.getElementById('reportContent');
                if(state.archivedInvoices.length===0){ content.innerHTML='<div class="app-card"><p class="text-secondary text-center">لا توجد فواتير مؤرشفة</p></div>'; return; }
                content.innerHTML = state.archivedInvoices.map(inv => {
                    const isOpen = expandedArchives[inv.id]||false;
                    return `<div class="archive-item"><div class="archive-header" data-toggle-archive="${inv.id}"><span>📦 <strong>${escHtml(inv.label)}</strong></span><span class="text-secondary" style="font-size:11px;">${formatDateArabic(inv.dateRange.start)} - ${formatDateArabic(inv.dateRange.end)} | ${inv.recordsCount} عملية | ${formatPrice(inv.totalAmount)} $</span><span>${icons.arrowDown}</span></div><div class="archive-details ${isOpen?'open':''}" id="archiveDetail-${inv.id}"><table class="invoice-table"><thead><tr><th>العامل</th><th>أيام العمل</th><th>الساعات</th><th>الأجر</th></tr></thead><tbody>${inv.items.map(w=>`<tr><td>${escHtml(w.workerName)}</td><td>${w.workDays}</td><td>${w.totalHours.toFixed(1)}</td><td>${formatPrice(w.totalWage)} $</td></tr>`).join('')}</tbody></table><details class="mt-2" style="font-size:12px;"><summary style="cursor:pointer;font-weight:600;color:var(--gold-dark);">تفاصيل يومية</summary><div style="margin-top:6px;">${inv.dailyGoods.map(d=>`<div style="margin-bottom:4px;padding:4px 6px;background:#fafaf7;border-radius:6px;"><strong>${formatDateArabic(d.date)}</strong> - ${formatPrice(d.dayTotal)} $<div style="font-size:11px;color:#666;">${d.goods.map(g=>`${escHtml(g.goodName)} (${g.goodType}) - ${formatUnitQuantity(g.goodType,g.length,g.width,g.height,g.quantity)} - ${formatPrice(g.totalAmount)} $`).join('<br>')}</div></div>`).join('')}</div></details><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;" class="no-print"><button class="btn-secondary" data-print-archive="${inv.id}" style="font-size:11px;">${icons.printer} طباعة</button><button class="btn-danger" data-delete-archive="${inv.id}" style="font-size:11px;">${icons.trash} حذف</button></div></div></div>`;
                }).join('');
                content.querySelectorAll('[data-toggle-archive]').forEach(h => h.addEventListener('click', function(){ const id=this.dataset.toggleArchive; expandedArchives[id]=!expandedArchives[id]; document.getElementById('archiveDetail-'+id).classList.toggle('open', expandedArchives[id]); }));
                content.querySelectorAll('[data-print-archive]').forEach(b => b.addEventListener('click', ()=>window.print()));
                content.querySelectorAll('[data-delete-archive]').forEach(b => b.addEventListener('click', function(){ const id=this.dataset.deleteArchive; const inv=state.archivedInvoices.find(i=>i.id===id); showModal('تأكيد الحذف',`هل أنت متأكد من حذف الفاتورة "<strong>${escHtml(inv.label)}</strong>"؟`,[{key:'cancel',label:'إلغاء',close:true},{key:'delete',label:'حذف',danger:true,callback:()=>{ state.archivedInvoices=state.archivedInvoices.filter(i=>i.id!==id); delete expandedArchives[id]; saveState(); showToast('🗑️ تم حذف الفاتورة'); renderReports(main); }}]); }));
            }

            // INIT
            function init() {
                loadState();
                document.querySelectorAll('.bottom-nav .nav-btn').forEach(btn => btn.addEventListener('click', function(){ currentTab=this.dataset.tab; updateNavActive(); renderContent(); }));
                document.getElementById('lockSubmitBtn').addEventListener('click', handleLockSubmit);
                document.getElementById('lockPasswordInput').addEventListener('keydown', e => { if(e.key==='Enter') handleLockSubmit(); });
                document.getElementById('lockConfirmInput').addEventListener('keydown', e => { if(e.key==='Enter') handleLockSubmit(); });
                document.getElementById('lockToggleEyeBtn').addEventListener('click', ()=>{ showPassword=!showPassword; document.getElementById('lockPasswordInput').type=showPassword?'text':'password'; document.getElementById('lockConfirmInput').type=showPassword?'text':'password'; this.innerHTML=(showPassword?icons.eyeOff:icons.eye)+' '+(showPassword?'إخفاء':'إظهار'); });
                if(state.password) { lockMode='enter'; updateLockScreen(); }
                else { document.getElementById('lockScreen').style.display='none'; document.getElementById('appShell').style.display='flex'; currentTab='production'; updateNavActive(); renderContent(); }
            }
            init();
        })();
    </script>
</body>
</html>
